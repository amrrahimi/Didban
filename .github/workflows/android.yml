name: Poker Vision AI - Android build

on:
  push:
    branches: [poker-vision]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # to publish the test APK as a pre-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch card detection model
        run: ./scripts/fetch_card_model.sh

      - name: Inspect card model (input/output format)
        run: |
          pip install --quiet onnx
          python - <<'PY'
          import onnx, json
          m = onnx.load("core/vision/src/main/assets/models/card_detector.onnx")
          for i in m.graph.input: print("INPUT", i.name, [d.dim_value or d.dim_param for d in i.type.tensor_type.shape.dim])
          for o in m.graph.output: print("OUTPUT", o.name, [d.dim_value or d.dim_param for d in o.type.tensor_type.shape.dim])
          print("OPSET", [(o.domain, o.version) for o in m.opset_import])
          for p in m.metadata_props: print("META", p.key, "=", p.value[:500])
          print("CLASSES", open("core/vision/src/main/assets/models/card_detector.classes.json").read()[:2000])
          PY

      - name: Unit tests (all modules)
        run: ./gradlew test --stacktrace --continue

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Print Room schema (to be committed)
        run: |
          for f in $(find core/database/schemas -name '*.json'); do
            echo "=== SCHEMA $f"; cat "$f"; echo; echo "=== END SCHEMA"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokerVisionAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish test build to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=poker-vision-latest
          cp app/build/outputs/apk/debug/app-debug.apk PokerVisionAI.apk
          NOTES="Latest automatic test build #${GITHUB_RUN_NUMBER} of the poker-vision branch (commit ${GITHUB_SHA::7}). Download PokerVisionAI.apk on your Android phone (Android 8.0+), about 101 MB, and open it to install."
          # Replace the file in place: the release (and the download link) never disappears, so a
          # download started during publishing can no longer get a missing or partial file.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PokerVisionAI.apk --clobber
            gh release edit "$TAG" --title "Poker Vision AI - test build #${GITHUB_RUN_NUMBER}" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" PokerVisionAI.apk --target "${GITHUB_SHA}" --prerelease \
              --title "Poker Vision AI - test build #${GITHUB_RUN_NUMBER}" --notes "$NOTES"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  instrumented:
    name: Device tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch card detection model
        run: ./scripts/fetch_card_model.sh

      - name: Fetch real card photos for the recognition smoke test
        run: python3 scripts/fetch_card_samples.py

      - name: Reference recognition (Python) on the same photos
        run: |
          pip install --quiet onnxruntime pillow numpy
          python3 scripts/reference_detect.py || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace || (adb logcat -d -s PVCardSamples:I; exit 1)
            adb logcat -d -s PVCardSamples:I

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: "**/build/reports/androidTests/"
          if-no-files-found: ignore
