name: Train card model

# Starts when ml/train_config.json (or the capture data under ml/data/) changes on this branch.
on:
  push:
    branches: [poker-vision]
    paths:
      - "ml/train_config.json"
      - "ml/data/**"

concurrency:
  group: train-card-model
  cancel-in-progress: true

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # publish the candidate model as a release asset
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: |
          pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install --quiet -r ml/requirements.txt

      - name: Read config
        id: cfg
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c = json.load(open("ml/train_config.json"))
          for k in ("data", "epochs", "imgsz", "composites"):
              print(f"{k}={c[k]}")
          PY

      - name: Baseline model (current app model) for comparison
        run: ./scripts/fetch_card_model.sh

      - name: Stand-in data from public photos
        if: steps.cfg.outputs.data == 'standin'
        run: python ml/make_standin_zip.py --out ml/build/standin.zip

      - name: Prepare dataset
        working-directory: ml
        run: |
          ZIP="${{ steps.cfg.outputs.data }}"
          if [ "$ZIP" = "standin" ]; then ZIP=build/standin.zip; else ZIP="../$ZIP"; fi
          python prepare_dataset.py --zip "$ZIP" --out build/dataset --composites ${{ steps.cfg.outputs.composites }}

      - name: Train
        working-directory: ml
        run: |
          python train.py --data build/dataset/data.yaml --epochs ${{ steps.cfg.outputs.epochs }} \
            --imgsz ${{ steps.cfg.outputs.imgsz }} --out build/model --runs build/runs

      - name: Evaluate against the current app model
        working-directory: ml
        run: |
          python evaluate.py --test build/dataset/test --candidate build/model/card_detector.onnx \
            --baseline ../core/vision/src/main/assets/models/card_detector.onnx --out build/model/report.md
          cat build/dataset/prepare_report.json
          cat build/model/report.md >> "$GITHUB_STEP_SUMMARY"
          sha256sum build/model/card_detector.onnx

      - name: Publish candidate model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=card-model-candidate
          cd ml/build/model
          cp ../dataset/prepare_report.json .
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "${GITHUB_SHA}" --prerelease --title "Card model candidate" \
              --notes "Candidate card-recognition model trained by the 'Train card model' workflow. Not used by the app until reviewed."
          fi
          gh release upload "$TAG" card_detector.onnx card_detector.classes.json report.md report.json prepare_report.json --clobber
          gh release edit "$TAG" --notes "Run #${GITHUB_RUN_NUMBER} (data: ${{ steps.cfg.outputs.data }}, epochs: ${{ steps.cfg.outputs.epochs }}). See report.md."
