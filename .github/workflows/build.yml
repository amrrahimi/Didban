name: Build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: >
          pyinstaller main.py --noconfirm --windowed --name Didban
          --collect-all ccxt --collect-submodules sklearn --collect-submodules pyqtgraph
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Didban/* -DestinationPath Didban-windows.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Didban.app Didban-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Didban-${{ runner.os }}
          path: Didban-*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Didban-*.zip
