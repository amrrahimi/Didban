name: Poker Vision AI - iOS build

# Builds the iPhone app on a GitHub Mac and publishes an unsigned PokerVisionAI.ipa.
# The user signs and installs it with their own Apple ID (Sideloadly / AltStore); no App Store.
on:
  push:
    branches: [poker-vision]
    paths-ignore:
      - "ml/**"
      - ".github/workflows/train-card-model.yml"
      - ".github/workflows/android.yml"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Shared tests + iPhone app (.ipa)
    runs-on: macos-15
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-2.0.21

      - name: Fetch card detection model
        run: |
          ./scripts/fetch_card_model.sh
          cp core/vision/src/main/assets/models/card_detector.onnx ios/app/Resources/
          cp core/vision/src/main/assets/models/card_detector.classes.json ios/app/Resources/

      - name: Shared Kotlin tests (iOS simulator)
        run: ./gradlew -p ios/shared iosSimulatorArm64Test --stacktrace

      - name: Build shared Kotlin framework
        run: ./gradlew -p ios/shared assemblePokerCoreReleaseXCFramework --stacktrace

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios/app && xcodegen generate

      - name: Build app (unsigned)
        run: |
          cd ios/app
          xcodebuild -version
          set +e
          xcodebuild -project PokerVision.xcodeproj -scheme PokerVision -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          code=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" xcodebuild.log | head -100
          exit $code

      - name: Show build errors
        if: failure()
        run: grep -n -B2 -A8 "error:" ios/app/xcodebuild.log | head -300 || true

      - name: Package .ipa
        run: |
          cd ios/app
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PokerVision.app Payload/
          ls -la Payload/PokerVision.app | head -40
          zip -qry ../../PokerVisionAI.ipa Payload
          ls -la ../../PokerVisionAI.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PokerVisionAI-ipa
          path: PokerVisionAI.ipa
          retention-days: 30

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=poker-vision-ios-latest
          NOTES="Latest iPhone build #${GITHUB_RUN_NUMBER} (commit ${GITHUB_SHA::7}). Unsigned: install PokerVisionAI.ipa with Sideloadly or AltStore using your own Apple ID (iOS 16+). With a free Apple ID it must be re-signed every 7 days."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" PokerVisionAI.ipa --clobber
            gh release edit "$TAG" --title "Poker Vision AI - iPhone build #${GITHUB_RUN_NUMBER}" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" PokerVisionAI.ipa --target "${GITHUB_SHA}" --prerelease \
              --title "Poker Vision AI - iPhone build #${GITHUB_RUN_NUMBER}" --notes "$NOTES"
          fi
